<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評価ダッシュボード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Meiryo UI', 'Yu Gothic', sans-serif; background: #f0f4f8; color: #1a202c; }
  header { background: #1F4E79; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; }
  header a { color: #BDD7EE; font-size: 13px; margin-left: auto; text-decoration: none; }
  header a:hover { color: #fff; }
  .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }

  .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; color: #1F4E79; border-bottom: 2px solid #BDD7EE; padding-bottom: 8px; margin-bottom: 16px; }

  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .filters .form-group { display: flex; flex-direction: column; gap: 4px; }
  .filters label { font-size: 12px; color: #555; font-weight: bold; }
  .filters select { padding: 7px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; font-family: inherit; }
  .filters select:focus { outline: none; border-color: #2E75B6; }
  .btn-refresh { background: #2E75B6; color: #fff; border: none; border-radius: 5px;
                 padding: 8px 18px; font-size: 13px; cursor: pointer; font-family: inherit; margin-top: 18px; }
  .btn-refresh:hover { background: #1F4E79; }

  /* サマリーカード */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .summary-card { background: #fff; border-radius: 8px; padding: 16px; text-align: center;
                  box-shadow: 0 2px 6px rgba(0,0,0,.08); border-top: 4px solid #2E75B6; }
  .summary-card .label { font-size: 12px; color: #666; margin-bottom: 6px; }
  .summary-card .value { font-size: 26px; font-weight: bold; color: #1F4E79; }
  .summary-card .sub { font-size: 11px; color: #999; margin-top: 4px; }

  /* 集計テーブル */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th { background: #1F4E79; color: #fff; padding: 9px 8px; text-align: center;
                   white-space: nowrap; position: sticky; top: 0; }
  .data-table td { padding: 7px 8px; border-bottom: 1px solid #e2e8f0; text-align: center; }
  .data-table tr:hover td { background: #EBF4FD; }
  .data-table .name-cell { text-align: left; font-weight: bold; }
  .data-table .dept-cell { color: #555; font-size: 12px; }
  .data-table .score-high  { color: #276749; font-weight: bold; }
  .data-table .score-mid   { color: #744210; }
  .data-table .score-low   { color: #822727; }
  .data-table .score-none  { color: #ccc; }
  .data-table .rank-1 { background: #FFD700; color: #7B5E00; font-weight: bold; border-radius: 3px; padding: 1px 5px; }
  .data-table .rank-2 { background: #C0C0C0; color: #555; font-weight: bold; border-radius: 3px; padding: 1px 5px; }
  .data-table .rank-3 { background: #CD7F32; color: #fff; font-weight: bold; border-radius: 3px; padding: 1px 5px; }

  .semi-col { background: #FFF9E6; }
  .semi-header { background: #BF8F00 !important; }

  .dept-header { background: #BDD7EE; font-weight: bold; font-size: 12px; }
  .dept-header td { text-align: left; padding-left: 10px; color: #1F4E79; }

  .table-wrapper { overflow-x: auto; }

  /* KPI詳細モーダル */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                   background: rgba(0,0,0,.5); z-index: 1000; }
  .modal { background: #fff; border-radius: 8px; max-width: 640px; width: 90%;
           max-height: 80vh; overflow-y: auto; padding: 24px;
           position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .modal h3 { color: #1F4E79; margin-bottom: 12px; }
  .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }
  .modal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .modal-table th { background: #f0f4f8; padding: 7px 8px; text-align: left; border-bottom: 1px solid #ddd; }
  .modal-table td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }

  .loading { text-align: center; padding: 40px; color: #666; font-size: 15px; }
  .no-data { text-align: center; padding: 24px; color: #999; font-size: 14px; }

  @media (max-width: 640px) {
    .semi-col { display: none; }
    .semi-header { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>📊 ハウジングロビー 評価ダッシュボード</h1>
  <a href="?page=input">✏️ 評価入力 →</a>
</header>

<div class="container">
  <!-- フィルター -->
  <div class="card">
    <div class="filters">
      <div class="form-group">
        <label>表示四半期</label>
        <select id="sel-quarter">
          <option value="">全期間</option>
          <option value="Q1">Q1（11月〜1月）</option>
          <option value="Q2">Q2（2月〜4月）</option>
          <option value="Q3">Q3（5月〜7月）</option>
          <option value="Q4">Q4（8月〜10月）</option>
          <option value="H1">上半期（Q1+Q2）</option>
          <option value="H2">下半期（Q3+Q4）</option>
        </select>
      </div>
      <div class="form-group">
        <label>部署</label>
        <select id="sel-dept">
          <option value="">全部署</option>
          <option>リーシング</option>
          <option>カスタマー</option>
          <option>経営企画</option>
          <option>民泊課</option>
          <option>総務管理</option>
          <option>管理推進</option>
        </select>
      </div>
      <button class="btn-refresh" onclick="loadData()">🔄 再読み込み</button>
    </div>
  </div>

  <!-- サマリー -->
  <div class="summary-grid" id="summary-grid">
    <div class="summary-card" style="border-color:#aaa">
      <div class="label">データ読込中</div>
      <div class="value">...</div>
    </div>
  </div>

  <!-- 集計テーブル -->
  <div class="card">
    <h2 id="table-title">📋 評価集計</h2>
    <div class="table-wrapper">
      <div class="loading" id="loading">データを読み込んでいます...</div>
      <table class="data-table" id="main-table" style="display:none">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="no-data" id="no-data" style="display:none">データがありません</div>
    </div>
  </div>
</div>

<!-- KPI詳細モーダル -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal').style.display='none'">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const EMPLOYEES = <?= JSON.stringify(employees) ?>;
let allRecords = [];

window.onload = function() { loadData(); };

function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('main-table').style.display = 'none';
  document.getElementById('no-data').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(jsonStr) {
      const data = JSON.parse(jsonStr);
      allRecords = data.records || [];
      renderDashboard();
    })
    .withFailureHandler(function(err) {
      document.getElementById('loading').textContent = 'エラー：' + err;
    })
    .getDashboardData();
}

function renderDashboard() {
  const quarter = document.getElementById('sel-quarter').value;
  const dept = document.getElementById('sel-dept').value;

  const scoreMap = buildScoreMap();
  let employees = Object.values(scoreMap);
  if (dept) employees = employees.filter(e => e.dept === dept);

  // サマリー更新
  updateSummary(employees, quarter);

  // テーブル描画
  renderTable(employees, quarter);
}

function updateSummary(employees, quarter) {
  const grid = document.getElementById('summary-grid');
  const inputCount = allRecords.length;
  const depts = [...new Set(employees.map(e => e.dept))].length;

  let avgScore = '—';
  const key = quarter || 'all';
  const qs = ['Q1','Q2','Q3','Q4','H1','H2'];
  const scores = [];
  if (quarter && qs.includes(quarter)) {
    employees.forEach(e => { if (e[quarter] !== null) scores.push(e[quarter]); });
  } else if (!quarter) {
    employees.forEach(e => {
      ['Q1','Q2','Q3','Q4'].forEach(q => { if (e[q] !== null) scores.push(e[q]); });
    });
  }
  if (scores.length) avgScore = (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);

  grid.innerHTML =
    summCard('入力済みレコード', inputCount + '件', '社員×四半期', '#2E75B6') +
    summCard('対象社員数', employees.length + '名', dept2label(), '#538135') +
    summCard('平均スコア', avgScore + '点', filterLabel(quarter), '#C55A11') +
    summCard('最高スコア', scores.length ? Math.max(...scores).toFixed(1)+'点' : '—', filterLabel(quarter), '#BF8F00');
}

function dept2label() {
  const d = document.getElementById('sel-dept').value;
  return d ? d : '全部署';
}
function filterLabel(q) {
  return { Q1:'Q1', Q2:'Q2', Q3:'Q3', Q4:'Q4', H1:'上半期', H2:'下半期', '':'全期間' }[q||''] || q;
}

function summCard(label, value, sub, color) {
  return '<div class="summary-card" style="border-color:'+color+'">'+
    '<div class="label">'+label+'</div>'+
    '<div class="value" style="color:'+color+'">'+value+'</div>'+
    '<div class="sub">'+sub+'</div></div>';
}

function renderTable(employees, quarter) {
  document.getElementById('loading').style.display = 'none';
  if (!employees.length) {
    document.getElementById('no-data').style.display = 'block';
    return;
  }

  const showQ = !quarter || ['Q1','Q2','Q3','Q4','H1','H2'].includes(quarter);
  const showH1 = !quarter || quarter === 'H1' || quarter === '';
  const showH2 = !quarter || quarter === 'H2' || quarter === '';

  // ヘッダー
  const thead = document.getElementById('table-head');
  let qHeaders = '';
  if (!quarter || quarter === 'Q1') qHeaders += '<th>Q1<br><small>11〜1月</small></th>';
  if (!quarter || quarter === 'Q2') qHeaders += '<th>Q2<br><small>2〜4月</small></th>';
  if (!quarter || quarter === 'Q3') qHeaders += '<th>Q3<br><small>5〜7月</small></th>';
  if (!quarter || quarter === 'Q4') qHeaders += '<th>Q4<br><small>8〜10月</small></th>';
  if (!quarter || quarter === 'H1') qHeaders += '<th class="semi-header">上半期<br><small>Q1+Q2</small></th>';
  if (!quarter || quarter === 'H2') qHeaders += '<th class="semi-header">下半期<br><small>Q3+Q4</small></th>';

  thead.innerHTML = '<tr><th>社員名</th><th>部署</th><th>役職</th>' + qHeaders + '<th>順位</th></tr>';

  // 順位計算（選択四半期のスコアで）
  const sortKey = quarter && ['Q1','Q2','Q3','Q4','H1','H2'].includes(quarter) ? quarter : 'Q3';
  const ranked = employees.slice().sort((a,b) => (b[sortKey]||0) - (a[sortKey]||0));
  const rankMap = {};
  ranked.forEach((e, i) => {
    const s = e[sortKey];
    if (s !== null) rankMap[e.name] = i + 1;
  });

  // 部署ごとにグループ化
  const depts = [...new Set(employees.map(e => e.dept))];
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  depts.forEach(function(dname) {
    const depEmps = employees.filter(e => e.dept === dname);

    // 部署ヘッダー行
    const drow = document.createElement('tr');
    drow.className = 'dept-header';
    const colspan = 3 + (quarter ? 1 : 6) + 1;
    drow.innerHTML = '<td colspan="' + colspan + '">【' + dname + '】</td>';
    tbody.appendChild(drow);

    depEmps.forEach(function(e) {
      const tr = document.createElement('tr');
      let qCells = '';
      const qs = [];
      if (!quarter || quarter === 'Q1') qs.push('Q1');
      if (!quarter || quarter === 'Q2') qs.push('Q2');
      if (!quarter || quarter === 'Q3') qs.push('Q3');
      if (!quarter || quarter === 'Q4') qs.push('Q4');
      if (!quarter || quarter === 'H1') qs.push('H1');
      if (!quarter || quarter === 'H2') qs.push('H2');

      qs.forEach(function(q) {
        const score = e[q];
        const isSemi = q === 'H1' || q === 'H2';
        const cls = isSemi ? ' class="semi-col"' : '';
        if (score === null) {
          qCells += '<td' + cls + '><span class="score-none">—</span></td>';
        } else {
          const scoreClass = score >= 80 ? 'score-high' : score >= 60 ? 'score-mid' : 'score-low';
          const hasKpis = e.kpis && e.kpis[q] && e.kpis[q].length;
          const onclick = hasKpis ? ' style="cursor:pointer" onclick="showDetail(\''+e.name+'\',\''+q+'\')"' : '';
          qCells += '<td' + cls + onclick + '><span class="' + scoreClass + '">' + score.toFixed(1) + '</span></td>';
        }
      });

      const rank = rankMap[e.name];
      let rankDisp = rank ? rank : '—';
      let rankClass = '';
      if (rank === 1) rankClass = 'rank-1';
      else if (rank === 2) rankClass = 'rank-2';
      else if (rank === 3) rankClass = 'rank-3';

      tr.innerHTML =
        '<td class="name-cell">' + e.name + '</td>' +
        '<td class="dept-cell">' + e.dept + '</td>' +
        '<td class="dept-cell">' + e.role + '</td>' +
        qCells +
        '<td><span class="' + rankClass + '">' + rankDisp + '</span></td>';
      tbody.appendChild(tr);
    });
  });

  document.getElementById('main-table').style.display = 'table';
}

function showDetail(name, quarter) {
  const emp = Object.values(buildScoreMap())[0];
  const scoreMapAll = buildScoreMap();
  const e = scoreMapAll[name];
  if (!e || !e.kpis || !e.kpis[quarter]) return;

  const kpis = e.kpis[quarter];
  document.getElementById('modal-title').textContent =
    name + ' ／ ' + quarter + '（' + quarterPeriod(quarter) + '）　合計：' + (e[quarter] || '—') + '点';

  let rows = kpis.map(function(k) {
    const ws = (k.weight && k.scale_result) ?
      (k.weight * parseFloat(k.scale_result) / 100).toFixed(1) : '—';
    return '<tr>' +
      '<td>' + k.name + '</td>' +
      '<td>' + (k.weight !== null ? k.weight + '%' : '—') + '</td>' +
      '<td>' + (k.result_input || '—') + '</td>' +
      '<td><strong>' + (k.scale_result || '—') + '</strong></td>' +
      '<td><strong>' + ws + '</strong></td></tr>';
  }).join('');

  document.getElementById('modal-body').innerHTML =
    '<table class="modal-table"><thead><tr>' +
    '<th>評価項目</th><th>重み</th><th>実績</th><th>尺度</th><th>加重点</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
  document.getElementById('modal').style.display = 'block';
}

function buildScoreMap() {
  const m = {};
  EMPLOYEES.forEach(function(e) {
    m[e.name] = { name: e.name, dept: e.dept, role: e.role,
                  Q1: null, Q2: null, Q3: null, Q4: null, H1: null, H2: null, kpis: {} };
  });
  allRecords.forEach(function(r) {
    if (!m[r.name]) return;
    m[r.name][r.quarter] = r.total;
    m[r.name].kpis[r.quarter] = r.kpis;
  });
  Object.values(m).forEach(function(e) {
    if (e.Q1 !== null && e.Q2 !== null) e.H1 = Math.round((e.Q1 + e.Q2) * 10) / 10;
    if (e.Q3 !== null && e.Q4 !== null) e.H2 = Math.round((e.Q3 + e.Q4) * 10) / 10;
  });
  return m;
}

function closeModal(e) {
  if (e.target === document.getElementById('modal'))
    document.getElementById('modal').style.display = 'none';
}

function quarterPeriod(q) {
  return { Q1:'11月〜1月', Q2:'2月〜4月', Q3:'5月〜7月', Q4:'8月〜10月', H1:'上半期', H2:'下半期' }[q] || q;
}
</script>
</body>
</html>
